[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "froeling-bridge"
version = "0.5.4"
description = "Web menu, S3200 reader and continuous p4d-compatible recording"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
froeling-bridge = "froeling_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
service = ["Flask>=3.1,<3.2", "waitress>=3,<4", "PyMySQL>=1.1,<1.2"]

[tool.setuptools.package-data]
froeling_bridge = ["openapi.json", "test-schema.json", "production-schema.json", "templates/*.html", "static/*.css", "static/*.js"]
