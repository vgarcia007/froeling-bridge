<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fröling Bridge · Anmeldung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-panel panel">
    <h1>Fröling Bridge</h1><p>Bitte melde dich an, um deine Heizung anzusehen.</p>
    {% if message %}<p class="error" role="alert">{{ message }}</p>{% endif %}
    <form method="post" action="/api/v1/auth/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">Benutzername</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button class="button" type="submit">Anmelden</button>
    </form>
    <p class="muted">Zugang und Passwort verwaltet der Serverbetreiber.</p>
  </main>
</body>
</html>
